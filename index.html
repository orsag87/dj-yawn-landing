<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>DJ YAWN - Links</title>
  <meta name="description" content="DJ YAWN. DJ and producer in Vancouver. Music, mixes and bookings." />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="DJ YAWN" />
  <meta property="og:description" content="DJ and producer. Vancouver. Music, mixes and bookings." />
  <meta property="og:image" content="https://links.djyawn.com/assets/og-links.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:image" content="https://links.djyawn.com/assets/og-links.jpg" />
  <meta name="theme-color" content="#151515" />

  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png?v=3" />
  <link rel="icon" type="image/png" sizes="96x96" href="assets/favicon.png?v=3" />
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png?v=3" />

  <!-- Fonts: Bebas Neue (display) + Space Mono (body/mono) — 2 families -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/style.css?v=9" />
</head>
<body>
  <div id="grain" aria-hidden="true"></div>


  <!-- Minimal status bar -->
  <header class="topbar">
    <span class="topbar-title">DJ YAWN</span>
  </header>

  <main>
    <!-- HERO -->
    <section class="hero" id="hero">
      <div class="hero-inner">
        <img class="hero-avatar" src="assets/profile.jpg" alt="DJ YAWN" />
        <img class="hero-logo" src="assets/logo-white.png" alt="DJ YAWN" />
        <h1 class="visually-hidden">DJ YAWN</h1>
        <p class="hero-tagline">DJ and producer</p>
        <p class="hero-meta">Vancouver, BC</p>
      </div>
    </section>

    <!-- STREAM (links rendered here by js/main.js) -->
    <section class="stream" id="stream" aria-label="Links"></section>

    <footer class="footer">
      <div class="footer-inner">
        <img class="footer-logo" src="assets/logo-white.png" alt="DJ YAWN" style="width:92px;height:auto;opacity:.5;display:block;margin:0 auto 18px" />
        <p class="footer-fine">© 2026 DJ YAWN · Vancouver, BC</p>
        <button class="to-surface" type="button" aria-label="Back to top">Back to top</button>
      </div>
    </footer>
  </main>

  <!-- Libraries (CDN) -->
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@studio-freight/lenis@1.0.42/dist/lenis.min.js"></script>
  <script src="js/main.js?v=14"></script>
</body>
</html>
